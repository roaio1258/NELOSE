name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project (unzip if needed)
        id: p
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$f" ]; then
            z=$(find . -iname '*.zip' -not -path './.git/*' | head -n1)
            if [ -n "$z" ]; then
              echo "Unzipping $z"
              mkdir -p /tmp/proj
              unzip -q -o "$z" -d /tmp/proj
              f=$(find /tmp/proj -name settings.gradle | head -n1)
            fi
          fi
          if [ -z "$f" ]; then
            echo "settings.gradle NOT FOUND. Files in repo:"
            find . -not -path './.git/*' | head -60
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nelose-mod
          path: ${{ steps.p.outputs.dir }}/build/libs/*.jar
